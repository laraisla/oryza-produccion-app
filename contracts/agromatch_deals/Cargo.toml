[package]
name = "agromatch-deals"
version = "0.1.0"
edition = "2021"
publish = false
description = "AgroMatch COMEX: registro verificable de versiones de acuerdos comerciales (solo hashes)."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
