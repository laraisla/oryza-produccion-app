[workspace]
resolver = "2"
members = ["agromatch_deals"]

[workspace.dependencies]
# Interfaz de protocolo 23: compatible con Testnet/Mainnet desde Protocol 23 en adelante.
soroban-sdk = "=23.5.3"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
